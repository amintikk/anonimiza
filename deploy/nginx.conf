# nginx for the anonimiza container (~/docker/anonimiza), behind Nginx Proxy Manager.
# The Content-Security-Policy is the privacy guarantee: the page may only connect to itself and to the
# models domain (connect-src), runs no inline or third-party scripts and cannot be framed.
# COOP + COEP make the page cross-origin isolated, which multi-threaded WebAssembly needs.
# nginx drops inherited add_header lines in any location that sets its own, hence the repetition.
server {
    listen 80;
    server_name _;

    # NPM already logs requests in front of this container; keep no second copy here.
    access_log off;
    # Relative redirects (e.g. /app -> /app/), so the https scheme from the proxy is kept.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    error_page 404 /404.html;

    # Build output with content hashes in the file names.
    location /assets/ {
        # A types block replaces the default map, so list every kind of file the build emits.
        types {
            application/javascript js mjs;
            text/css css;
            application/wasm wasm;
            font/woff2 woff2;
            font/woff woff;
            image/svg+xml svg;
            application/json json;
        }
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://anonimiza-models.aminox.dev; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ONNX Runtime binaries and pdf.js data (replaced on each deploy, so revalidate).
    location ~ ^/(ort|pdfjs)/ {
        types {
            application/javascript mjs;
            application/wasm wasm;
            application/octet-stream bcmap pfb;
            font/ttf ttf;
        }
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://anonimiza-models.aminox.dev; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://anonimiza-models.aminox.dev; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
